[webbook-login]
enabled  = true
filter   = webbook-login
logpath  = /var/log/apache2/error.log
maxretry = 5
findtime = 300
bantime  = 600
port     = http,https

[apache-badbots]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/access.log
maxretry = 2

[apache-noscript]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/error.log
maxretry = 6
