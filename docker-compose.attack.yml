services:
  db_attack:
    image: mariadb:10.11
    container_name: webbook_attack_db
    environment:
      MYSQL_DATABASE: quanlybanbooks
      MYSQL_USER: webbook_attack
      MYSQL_PASSWORD: webbook_attack_password
      MYSQL_ROOT_PASSWORD: webbook_attack_root
    volumes:
      - db_attack_data:/var/lib/mysql
      - ./quanlybanbooks.sql:/docker-entrypoint-initdb.d/01-quanlybanbooks.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uwebbook_attack -pwebbook_attack_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - attack_network

  web_attack:
    build:
      context: .
      dockerfile: Dockerfile.attack
    container_name: webbook_attack_web
    environment:
      DB_HOST: db_attack
      DB_USER: webbook_attack
      DB_PASSWORD: webbook_attack_password
      DB_NAME: quanlybanbooks
      WEBBOOK_SECURITY_MODE: attack
      WEBBOOK_INSTANCE: ATTACK
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
      - ./apache-logs/attack:/var/log/apache2
    depends_on:
      db_attack:
        condition: service_healthy
    networks:
      - attack_network

networks:
  attack_network:
    name: webbook_attack_network
    driver: bridge

volumes:
  db_attack_data:
