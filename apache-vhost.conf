<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off

    # Redirect to HTTPS while preserving the host used by the client.
    # This avoids sending a Windows browser to https://localhost:8443/ when
    # the lab is opened through the Ubuntu VM IP.
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}:8443%{REQUEST_URI} [R=301,L,NE]

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    <Directory /var/www/html/uploads>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
