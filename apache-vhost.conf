<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # ==== HTTP SECURITY HEADERS (mục 4 của đề) ====
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # HSTS chỉ có tác dụng thật khi chạy qua HTTPS (port 443), để sẵn ở đây không hại gì
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # ==== CHẶN PHP THỰC THI TRONG THƯ MỤC UPLOADS (chống RCE qua file upload) ====
    <Directory /var/www/html/uploads>
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
