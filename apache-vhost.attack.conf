<VirtualHost *:80>
    ServerName attack.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # ATTACK LAB ONLY: deliberately no ModSecurity/WAF and no hardening headers.
    # This instance is intended for the isolated before/after security demonstration.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
